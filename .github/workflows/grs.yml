name: Update README cards

on:
  push:
    paths:
      - ".github/workflows/grs.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate personal stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=DSchuppelius&include_all_commits=true&show_icons=true&hide_border=true&theme=dark
          path: profile/personal-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate personal stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=DSchuppelius&include_all_commits=true&show_icons=true&hide_border=true&theme=buefy
          path: profile/personal-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate personal languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=DSchuppelius&layout=compact&hide_border=true&theme=dark
          path: profile/personal-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate personal languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=DSchuppelius&layout=compact&hide_border=true&theme=buefy
          path: profile/personal-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate combined personal and business overview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from xml.sax.saxutils import escape

          TOKEN = os.environ["GITHUB_TOKEN"]
          USER = "DSchuppelius"
          ORG = "Daniel-Jorg-Schuppelius"

          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "DSchuppelius-profile-stats",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def fetch_repos(url):
              repos = []
              page = 1
              while True:
                  separator = "&" if "?" in url else "?"
                  batch = github_get(f"{url}{separator}per_page=100&page={page}")
                  repos.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return [repo for repo in repos if not repo.get("fork")]

          personal = fetch_repos(f"https://api.github.com/users/{USER}/repos?type=owner&sort=full_name")
          business = fetch_repos(f"https://api.github.com/orgs/{ORG}/repos?type=public&sort=full_name")

          personal_stars = sum(repo.get("stargazers_count", 0) for repo in personal)
          business_stars = sum(repo.get("stargazers_count", 0) for repo in business)
          total_stars = personal_stars + business_stars
          total_repos = len(personal) + len(business)
          total_forks = sum(repo.get("forks_count", 0) for repo in personal + business)

          Path("profile").mkdir(exist_ok=True)

          def render(path, dark=False):
              bg = "#151515" if dark else "#ffffff"
              border = "#151515" if dark else "#e4e2e2"
              title = "#f0f6fc" if dark else "#2f80ed"
              text = "#c9d1d9" if dark else "#434d58"
              muted = "#8b949e" if dark else "#586069"
              value = "#f0f6fc" if dark else "#24292e"
              accent = "#79ff97" if dark else "#4c71f2"

              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Combined GitHub project statistics">
            <rect x="0.5" y="0.5" rx="4.5" width="494" height="194" fill="{bg}" stroke="{border}"/>
            <style>
              .title {{ font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: {title}; }}
              .label {{ font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: {text}; }}
              .muted {{ font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: {muted}; }}
              .value {{ font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: {value}; }}
              .accent {{ fill: {accent}; }}
            </style>
            <text x="25" y="34" class="title">Open Source Overview</text>
            <text x="25" y="55" class="muted">{escape(USER)} + {escape(ORG)}</text>

            <text x="25" y="84" class="label accent">★</text>
            <text x="47" y="84" class="label">Total Stars:</text>
            <text x="455" y="84" text-anchor="end" class="value">{total_stars}</text>

            <text x="47" y="108" class="muted">Personal:</text>
            <text x="220" y="108" text-anchor="end" class="value">{personal_stars}</text>
            <text x="270" y="108" class="muted">Business:</text>
            <text x="455" y="108" text-anchor="end" class="value">{business_stars}</text>

            <text x="25" y="139" class="label accent">◉</text>
            <text x="47" y="139" class="label">Repositories:</text>
            <text x="220" y="139" text-anchor="end" class="value">{total_repos}</text>
            <text x="270" y="139" class="label">Forks:</text>
            <text x="455" y="139" text-anchor="end" class="value">{total_forks}</text>

            <text x="25" y="172" class="muted">Public, non-fork repositories · updated daily</text>
          </svg>'''
              Path(path).write_text(svg, encoding="utf-8")

          render("profile/combined-overview-light.svg", dark=False)
          render("profile/combined-overview-dark.svg", dark=True)
          print(f"Personal stars: {personal_stars}")
          print(f"Business stars: {business_stars}")
          print(f"Total stars: {total_stars}")
          PY

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/personal-*.svg profile/combined-overview-*.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update GitHub README stats"
          git pull --rebase origin main
          git push origin main
