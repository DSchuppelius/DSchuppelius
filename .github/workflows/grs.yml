name: Update README cards

on:
  push:
    paths:
      - ".github/workflows/grs.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate personal stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=DSchuppelius&include_all_commits=true&show_icons=true&hide_border=true&theme=dark
          path: profile/personal-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate personal stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=DSchuppelius&include_all_commits=true&show_icons=true&hide_border=true&theme=buefy
          path: profile/personal-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate personal languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=DSchuppelius&layout=compact&hide_border=true&theme=dark
          path: profile/personal-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate personal languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=DSchuppelius&layout=compact&hide_border=true&theme=buefy
          path: profile/personal-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate business stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Daniel-Jorg-Schuppelius&include_all_commits=true&show_icons=true&hide_border=true&theme=dark
          path: profile/business-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate business stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Daniel-Jorg-Schuppelius&include_all_commits=true&show_icons=true&hide_border=true&theme=buefy
          path: profile/business-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate business languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Daniel-Jorg-Schuppelius&layout=compact&hide_border=true&theme=dark
          path: profile/business-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate business languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Daniel-Jorg-Schuppelius&layout=compact&hide_border=true&theme=buefy
          path: profile/business-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub README stats" || exit 0
          git push
